<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standard kategorie</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; background: #f7f3f0; font-family: "Inter", system-ui, sans-serif; color: #1f1a17; }
  .top { padding: 18px 20px; display: flex; justify-content: space-between; font-size: 15px; font-weight: 650; }
  h1 { margin: 28px 20px 0; font-size: 34px; line-height: 1.08; letter-spacing: -0.03em; font-weight: 750; }
  .sub { margin: 14px 20px 0; font-size: 15px; line-height: 1.45; color: #6f655c; }
  .cta { margin: 22px 20px 0; height: 50px; border-radius: 14px; background: #c84a32; color: #fff; font-size: 16px; font-weight: 600; display: grid; place-items: center; }
  .phone { margin: 30px auto 0; width: 200px; height: 330px; border-radius: 30px; background: #fff; box-shadow: 0 16px 40px rgba(31,26,23,0.14); padding: 14px; }
  .phone div { height: 100%; border-radius: 18px; background: #f2ece8; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 22px 20px; }
  .cards div { height: 90px; border-radius: 16px; background: #fff; }
</style>
</head>
<body>
  <div class="top"><span>Cycle Tracker</span><span>Přihlásit</span></div>
  <h1>Zapisuj svůj cyklus jednoduše.</h1>
  <p class="sub">Teplota, pozorování a přehledná mapa cyklu v telefonu.</p>
  <div class="cta">Začít</div>
  <div class="phone"><div></div></div>
  <div class="cards"><div></div><div></div><div></div></div>
</body>
</html>
